    <rect x="243.27" y="54" width="53.07" height="10" fill="#3178c6"/>
    <rect x="296.34" y="54" width="39.28" height="10" fill="#3572A5"/>
    <rect x="335.61" y="54" width="25.30" height="10" fill="#f1e05a"/>
    <rect x="360.91" y="54" width="23.72" height="10" fill="#f34b7d"/>
    <rect x="384.63" y="54" width="22.48" height="10" fill="#438eff"/>
    <rect x="407.11" y="54" width="10.50" height="10" fill="#e34c26"/>
    <rect x="417.61" y="54" width="8.49" height="10" fill="#F05138"/>
    <rect x="426.10" y="54" width="29.90" height="10" fill="#8b949e"/>
  </g>
  <g>
    <circle cx="29" cy="88" r="5" fill="#555555"/>
