<svg xmlns="http://www.w3.org/2000/svg" width="480" height="242" viewBox="0 0 480 242" role="img" aria-labelledby="truestats-languages-title truestats-languages-desc">
  <title id="truestats-languages-title">Most used languages</title>
  <desc id="truestats-languages-desc">C 50.8%, TypeScript 12.3%, Python 9.1%, JavaScript 5.9%, C++ 5.5%, Objective-C 5.2%, HTML 2.4%, Swift 2.0%, Other 6.9%</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #e6edf3; }
    .label { font-size: 13px; fill: #8b949e; }
    .value { font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .small { font-size: 11px; fill: #8b949e; }
    .big { font-size: 28px; font-weight: 600; fill: #c9d1d9; }
    .accent { fill: #58a6ff; }
    .body { font-size: 13px; fill: #c9d1d9; }
  </style>
  <rect x="0.5" y="0.5" width="479" height="241" rx="7.5" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="36" class="title">Most used languages</text>
  <defs>
    <clipPath id="truestats-lang-bar"><rect x="24" y="54" width="432" height="10" rx="5"/></clipPath>
  </defs>
  <rect x="24" y="54" width="432" height="10" rx="5" fill="#21262d"/>
  <g clip-path="url(#truestats-lang-bar)">
